name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also publishes the dashboard (deploy-dashboard job)

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits through the API.
  pull-requests: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      # Cosmos DB emulator for the persistence tests (they skip themselves when it isn't configured).
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
        ports:
          - 8081:8081
          - 8080:8080
        env:
          PROTOCOL: https
    env:
      CIX_COSMOS_EMULATOR: https://localhost:8081
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Cix.slnx

      - name: Build
        run: dotnet build Cix.slnx --no-restore --configuration Release

      - name: Wait for the Cosmos DB emulator
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready > /dev/null; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "::warning::Cosmos DB emulator not ready; persistence tests will fail"

      - name: Test
        run: dotnet test Cix.slnx --no-build --configuration Release --logger "trx;LogFilePrefix=results" --results-directory TestResults

      # Failed tests as annotations, so they can be read through the API (check-run annotations) without log access.
      - name: Report failed tests
        if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          esc = lambda s: (s or "").replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              for r in ET.parse(path).getroot().iterfind(".//t:UnitTestResult[@outcome='Failed']", ns):
                  msg = r.findtext(".//t:ErrorInfo/t:Message", "", ns)
                  trace = r.findtext(".//t:ErrorInfo/t:StackTrace", "", ns)
                  print(f"::error title={esc(r.get('testName'))}::{esc((msg + chr(10) + trace)[:1500])}")

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # The Compose images build, and the engine starts in its container against the emulator (paper, no exchange keys).
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the agent loops
        # Findings as annotations, readable through the API like test failures.
        run: |
          set -o pipefail
          shellcheck -x -f gcc tools/trader/run-trader.sh tools/trader/run-analyst.sh tools/trader/agent-common.sh \
            | sed -E 's/^([^:]+):([0-9]+):[0-9]+: (.*)$/::error file=\1,line=\2::\3/'

      - name: Placeholder secrets (built at run time, never committed)
        run: |
          mkdir -p secrets logs/trader logs/analyst
          head -c 32 /dev/urandom | base64 > secrets/operator_key
          printf 'not-a-real-token' > secrets/claude_token

      - name: Build images
        run: docker compose build

      - name: Engine starts in Compose
        run: |
          docker compose up -d cosmos engine
          for i in $(seq 1 60); do
            out="$(docker compose logs engine 2>&1 || true)"
            if grep -q "Application started" <<<"$out"; then echo "engine running"; exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs engine | tail -60 | sed 's/^/::error::/'
          exit 1

      - name: Engine is healthy, and survives a restart of everything at once without crashing
        # Like a PC reboot: the database and the engine start together; the engine must wait for the database, not crash.
        run: |
          engine() { docker compose ps -q engine; }
          healthy() { [ "$(docker inspect -f '{{.State.Health.Status}}' "$(engine)")" = healthy ]; }
          wait_healthy() {
            for _ in $(seq 1 120); do healthy && return 0; sleep 5; done
            docker compose logs engine | tail -60 | sed 's/^/::error::/'
            return 1
          }
          wait_healthy
          echo "engine healthy"
          docker compose stop engine cosmos
          docker compose up -d cosmos engine
          wait_healthy
          restarts="$(docker inspect -f '{{.RestartCount}}' "$(engine)")"
          if [ "$restarts" != 0 ]; then echo "::error::the engine crashed and was restarted $restarts times while the database started"; exit 1; fi
          docker compose logs engine | grep -E "Waiting for the database|ready after" || true
          echo "engine healthy again after a cold start, no crash"

      - name: Stop
        if: always()
        run: docker compose down -v

  # The dashboard API's tests, and that the Azure templates and scripts are valid. Nothing here touches Azure.
  azure-and-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dashboard API tests
        working-directory: dashboard/api
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          npm test

      - name: Bicep builds and lints cleanly
        run: |
          az bicep install
          for f in infra/main.bicep infra/shared/main.bicep; do
            az bicep build --file "$f" --stdout > /dev/null
            az bicep lint --file "$f"
          done

      - name: Azure scripts on PowerShell 7 (parse, module, provision preview with a fake az, signing)
        shell: pwsh
        run: ./tests/azure/CixAzure.Tests.ps1

  azure-scripts-windows-powershell:
    # The owner runs the Azure scripts in Windows PowerShell 5.1, which has no 7-only syntax or parameters.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Azure scripts on Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/azure/CixAzure.Tests.ps1

      - name: Azure scripts on PowerShell 7 on Windows
        shell: pwsh
        run: ./tests/azure/CixAzure.Tests.ps1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dashboard:
    # Publishes dashboard/ to the Static Web App after a push to main that changes it (or on a manual run), once the
    # dashboard tests and the secret scan pass. The deployment token is an environment secret: set it in the "dashboard"
    # environment, limited to the main branch, so pull-request workflows can never read it (docs/azure.md).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [azure-and-dashboard, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dashboard
    concurrency:
      group: deploy-dashboard
      cancel-in-progress: false
    env:
      SWA_CLI_VERSION: "2.0.1" # the same pinned version as tools/azure/provision.ps1 ($SwaCliVersion)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the dashboard change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- dashboard .github/workflows/ci.yml; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "::notice::No dashboard changes; not publishing."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.deploy == 'true'
        with:
          node-version: "22"

      - name: Publish the dashboard
        if: steps.changed.outputs.deploy == 'true'
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_CLI_DEPLOYMENT_TOKEN" ]; then
            echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN isn't set in the dashboard environment; skipping (docs/azure.md)."
            exit 0
          fi
          (cd dashboard/api && npm install --omit=dev --no-audit --no-fund --ignore-scripts)
          npx --yes "@azure/static-web-apps-cli@${SWA_CLI_VERSION}" deploy dashboard/app --api-location dashboard/api \
            --api-language node --api-version 22 --env production
