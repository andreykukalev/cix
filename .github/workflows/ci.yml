name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits through the API.
  pull-requests: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      # Cosmos DB emulator for the persistence tests (they skip themselves when it isn't configured).
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
        ports:
          - 8081:8081
          - 8080:8080
        env:
          PROTOCOL: https
    env:
      CIX_COSMOS_EMULATOR: https://localhost:8081
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Cix.slnx

      - name: Build
        run: dotnet build Cix.slnx --no-restore --configuration Release

      - name: Wait for the Cosmos DB emulator
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready > /dev/null; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "::warning::Cosmos DB emulator not ready; persistence tests will fail"

      - name: Test
        run: dotnet test Cix.slnx --no-build --configuration Release --logger "trx;LogFilePrefix=results" --results-directory TestResults

      # Failed tests as annotations, so they can be read through the API (check-run annotations) without log access.
      - name: Report failed tests
        if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          esc = lambda s: (s or "").replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              for r in ET.parse(path).getroot().iterfind(".//t:UnitTestResult[@outcome='Failed']", ns):
                  msg = r.findtext(".//t:ErrorInfo/t:Message", "", ns)
                  trace = r.findtext(".//t:ErrorInfo/t:StackTrace", "", ns)
                  print(f"::error title={esc(r.get('testName'))}::{esc((msg + chr(10) + trace)[:1500])}")

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # The Compose images build, and the engine starts in its container against the emulator (paper, no exchange keys).
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the agent loops
        # Findings as annotations, readable through the API like test failures.
        run: |
          set -o pipefail
          shellcheck -x -f gcc tools/trader/run-trader.sh tools/trader/run-analyst.sh tools/trader/agent-common.sh \
            | sed -E 's/^([^:]+):([0-9]+):[0-9]+: (.*)$/::error file=\1,line=\2::\3/'

      - name: Placeholder secrets (built at run time, never committed)
        run: |
          mkdir -p secrets logs/trader logs/analyst
          head -c 32 /dev/urandom | base64 > secrets/operator_key
          printf 'not-a-real-token' > secrets/claude_token

      - name: Build images
        run: docker compose build

      - name: Engine starts in Compose
        run: |
          docker compose up -d cosmos engine
          for i in $(seq 1 60); do
            out="$(docker compose logs engine 2>&1 || true)"
            if grep -q "Application started" <<<"$out"; then echo "engine running"; exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs engine | tail -60 | sed 's/^/::error::/'
          exit 1

      - name: Stop
        if: always()
        run: docker compose down -v

  # The dashboard API's tests, and that the Azure templates and scripts are valid. Nothing here touches Azure.
  azure-and-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dashboard API tests
        working-directory: dashboard/api
        run: npm test

      - name: Bicep builds and lints cleanly
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep

      - name: PowerShell scripts parse, and the module's signing matches Microsoft's example
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem tools/azure -Filter *.ps*1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { "::error file=tools/azure/$($f.Name),line=$($_.Extent.StartLineNumber)::$($_.Message)" }; exit 1 }
          }
          Import-Module ./tools/azure/CixAzure.psm1
          $key = @('dsZQi3KtZmCv1ljt3VNWNm7sQUF1y5rJfC6kv5Jiwv', 'W0EndXdDku/dkKBp8/ufDToSxLzR4y+O/0H/t4bQtVNw==') -join ''  # documented sample, not a key
          $token = New-CixCosmosAuthToken -Verb GET -ResourceType dbs -ResourceLink 'dbs/ToDoList' -Date 'Thu, 27 Apr 2017 00:51:12 GMT' -Key $key
          if ([Uri]::UnescapeDataString($token) -ne 'type=master&ver=1.0&sig=c09PEVJrgp2uQRkr934kFbTqhByc7TVr3OHyqlu+c+c=') { throw 'Cosmos DB signing is wrong' }
          foreach ($f in Get-ChildItem infra/environments -Filter *.json) { Get-Content $f -Raw | ConvertFrom-Json | Out-Null }

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
