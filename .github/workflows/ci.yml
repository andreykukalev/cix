name: CI

# Pull request runs say which push they test: the PR, how many commits it has, what happened (opened, synchronize for a
# new push) and the head commit (in full: expressions can't shorten it). The plan job's summary has the commit's subject.
# Other runs keep GitHub's default name (an empty run-name falls back to it).
run-name: "${{ github.event_name == 'pull_request' && format('#{0} · {1} commit(s) · {2} · {3} · {4}', github.event.pull_request.number, github.event.pull_request.commits, github.event.action, github.event.pull_request.title, github.event.pull_request.head.sha) || '' }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also publishes the dashboard and deploys the engine and agents (deploy-dashboard, deploy-agents)

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits through the API.
  pull-requests: read

# A new push to a pull request cancels its run still in progress: only the latest commit's result matters. Other runs
# (main, manual) each get their own group, so none is ever cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs this run needs (tools/ci/plan.sh), to save Actions minutes: only the parts the change touches, and
  # nothing again for a merge a green pull request already tested exactly. Changes to CI itself run everything.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # which pull request a merge came from
      issues: read # whether its base ever changed (the pull request's timeline)
      actions: read # whether its CI run's jobs passed
    outputs:
      dotnet: ${{ steps.plan.outputs.dotnet }}
      containers: ${{ steps.plan.outputs.containers }}
      azure: ${{ steps.plan.outputs.azure }}
      windows: ${{ steps.plan.outputs.windows }}
      secrets: ${{ steps.plan.outputs.secrets }}
      dashboard: ${{ steps.plan.outputs.dashboard }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/plan.sh

  build-test:
    needs: plan
    if: needs.plan.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    services:
      # Cosmos DB emulator for the persistence tests (they skip themselves when it isn't configured).
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
        ports:
          - 8081:8081
          - 8080:8080
        env:
          PROTOCOL: https
    env:
      CIX_COSMOS_EMULATOR: https://localhost:8081
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Cix.slnx

      - name: Build
        run: dotnet build Cix.slnx --no-restore --configuration Release

      - name: Wait for the Cosmos DB emulator
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready > /dev/null; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "::warning::Cosmos DB emulator not ready; persistence tests will fail"

      - name: Test
        run: dotnet test Cix.slnx --no-build --configuration Release --logger "trx;LogFilePrefix=results" --results-directory TestResults

      # Failed tests as annotations, so they can be read through the API (check-run annotations) without log access.
      - name: Report failed tests
        if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          esc = lambda s: (s or "").replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              for r in ET.parse(path).getroot().iterfind(".//t:UnitTestResult[@outcome='Failed']", ns):
                  msg = r.findtext(".//t:ErrorInfo/t:Message", "", ns)
                  trace = r.findtext(".//t:ErrorInfo/t:StackTrace", "", ns)
                  print(f"::error title={esc(r.get('testName'))}::{esc((msg + chr(10) + trace)[:1500])}")

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # The Compose images build, and the engine starts in its container against the emulator (paper, no exchange keys).
  containers:
    needs: plan
    if: needs.plan.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the agent loops
        # Findings as annotations, readable through the API like test failures.
        run: |
          set -o pipefail
          shellcheck -x -f gcc tools/trader/run-trader.sh tools/trader/run-analyst.sh tools/trader/agent-common.sh \
            tools/trader/agent-job.sh tools/ci/deploy-agents.sh tools/ci/agents-tip.sh \
            | sed -E 's/^([^:]+):([0-9]+):[0-9]+: (.*)$/::error file=\1,line=\2::\3/'

      - name: Agent job mode (Azure), against a mock engine, queues and identity endpoint
        run: python3 tools/trader/test-agent-job.py

      - name: Deploying the engine and the agents to Azure, against a fake az and docker (with the rollbacks)
        run: python3 tools/ci/test-deploy-agents.py

      - name: Placeholder secrets (built at run time, never committed)
        run: |
          mkdir -p secrets logs/trader logs/analyst
          head -c 32 /dev/urandom | base64 > secrets/operator_key
          printf 'not-a-real-token' > secrets/claude_token

      - name: Build images
        run: docker compose build

      - name: Engine starts in Compose
        run: |
          docker compose up -d cosmos engine
          for i in $(seq 1 60); do
            out="$(docker compose logs engine 2>&1 || true)"
            if grep -q "Application started" <<<"$out"; then echo "engine running"; exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs engine | tail -60 | sed 's/^/::error::/'
          exit 1

      - name: Engine is healthy, and survives a restart of everything at once without crashing
        # Like a PC reboot: the database and the engine start together; the engine must wait for the database, not crash.
        run: |
          engine() { docker compose ps -q engine; }
          healthy() { [ "$(docker inspect -f '{{.State.Health.Status}}' "$(engine)")" = healthy ]; }
          wait_healthy() {
            for _ in $(seq 1 120); do healthy && return 0; sleep 5; done
            docker compose logs engine | tail -60 | sed 's/^/::error::/'
            return 1
          }
          wait_healthy
          echo "engine healthy"
          docker compose stop engine cosmos
          docker compose up -d cosmos engine
          wait_healthy
          restarts="$(docker inspect -f '{{.RestartCount}}' "$(engine)")"
          if [ "$restarts" != 0 ]; then echo "::error::the engine crashed and was restarted $restarts times while the database started"; exit 1; fi
          docker compose logs engine | grep -E "Waiting for the database|ready after" || true
          echo "engine healthy again after a cold start, no crash"

      - name: Stop
        if: always()
        run: docker compose down -v

  # The dashboard API's tests, and that the Azure templates and scripts are valid. Nothing here touches Azure.
  azure-and-dashboard:
    needs: plan
    if: needs.plan.outputs.azure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dashboard API tests
        working-directory: dashboard/api
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          npm test

      - name: Bicep builds and lints cleanly
        run: |
          az bicep install
          for f in infra/main.bicep infra/shared/main.bicep; do
            az bicep build --file "$f" --stdout > /dev/null
            az bicep lint --file "$f"
          done

      - name: Azure scripts on PowerShell 7 (parse, module, provision preview with a fake az, signing)
        shell: pwsh
        run: ./tests/azure/CixAzure.Tests.ps1

  azure-scripts-windows-powershell:
    # The owner runs the Azure scripts in Windows PowerShell 5.1, which has no 7-only syntax or parameters. Windows
    # minutes count double, so this runs only when the Azure scripts, their tests or the templates change.
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Azure scripts on Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/azure/CixAzure.Tests.ps1

      - name: Azure scripts on PowerShell 7 on Windows
        shell: pwsh
        run: ./tests/azure/CixAzure.Tests.ps1

  secret-scan:
    needs: plan
    if: needs.plan.outputs.secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dashboard-bundle:
    # Step 1 of publishing the dashboard (after a push to main that changes it, or a manual run on main): install the API's
    # dependency and the pinned Static Web Apps CLI here, in a job with no Azure access, so no npm install script ever
    # runs where credentials are in reach. Hands the result to deploy-dashboard as an artifact.
    # Published when the dashboard or its settings changed, or on a manual run.
    needs: plan
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.plan.outputs.dashboard == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SWA_CLI_VERSION: "2.0.1" # the same pinned version as tools/azure/provision.ps1 ($SwaCliVersion)
    outputs:
      publish: ${{ steps.tip.outputs.publish }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Is this still the tip of main?
        id: tip
        env:
          GH_TOKEN: ${{ github.token }} # this step only
        run: |
          # Runs can finish out of order; an older one must not publish over a newer dashboard. A newer push that didn't
          # change the dashboard doesn't publish, so an older run still publishes when its dashboard (and the workflow that
          # deploys it) is the tip's. Asked through the API, as the deploy job does: reading it with git and a bearer header
          # didn't work here (silently), so no run published after #76.
          if ! tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) || [ -z "$tip" ]; then
            echo "::error::Couldn't read the tip of main, so the dashboard isn't published."
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif ! changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$tip" --jq '
                 if .status == "ahead" and (.files | length) < 300
                 then [.files[].filename | select(startswith("dashboard/") or startswith("infra/") or startswith(".github/workflows/"))] | length
                 else -1 end'); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Couldn't compare this commit with the tip of main ($tip); not publishing. The newer run publishes."
          elif [ "$changed" = 0 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on, but its dashboard is this one; publishing."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on with dashboard changes ($tip); the newer run publishes the dashboard."
          fi

      - uses: actions/setup-node@v4
        if: steps.tip.outputs.publish == 'true'
        with:
          node-version: "22"

      - name: Install the API's dependency and the Static Web Apps CLI
        id: bundle
        if: steps.tip.outputs.publish == 'true'
        run: |
          (cd dashboard/api && npm install --omit=dev --no-audit --no-fund --ignore-scripts)
          npm install --prefix .swa-cli --no-audit --no-fund "@azure/static-web-apps-cli@${SWA_CLI_VERSION}"
          tar -czf dashboard-bundle.tgz dashboard infra/environments .swa-cli
          # The deploy job checks this hash: a job output can't be changed by other jobs, an artifact could be replaced.
          echo "sha256=$(sha256sum dashboard-bundle.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.tip.outputs.publish == 'true'
        with:
          name: dashboard-bundle
          path: dashboard-bundle.tgz
          retention-days: 1

  deploy-dashboard:
    # Step 2: sign in to Azure as the dashboard's deploy identity, which trusts only workflows on main of this repository
    # (an OIDC federated credential) and may only read this Static Web App's deployment token. No secret is stored in
    # GitHub; the repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID are IDs, not secrets.
    # Set up once with tools/azure/setup-ci-deploy.ps1 (docs/azure.md, ADR-0010).
    needs: [azure-and-dashboard, secret-scan, dashboard-bundle]
    # The checks may have been skipped (they passed on this exact content in the pull request); none may have failed,
    # and cancelling the run stops the publish.
    if: >-
      !cancelled() && needs.dashboard-bundle.outputs.publish == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for the Azure sign-in; only this job and deploy-agents have it
    concurrency:
      group: deploy-dashboard
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      DASHBOARD_ENVIRONMENT: ${{ vars.DASHBOARD_ENVIRONMENT || 'dev' }}
    steps:
      - name: Is the deploy identity set up?
        id: setup
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Set the repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID (tools/azure/setup-ci-deploy.ps1)."; exit 1
          fi
          echo "::notice::The dashboard's deploy identity isn't set up yet; skipping (docs/azure.md)."

      - name: Still the tip of main?
        id: tip
        if: steps.setup.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }} # this step only; the publish step below doesn't get it
        run: |
          # Checked again inside the concurrency group: an older run waiting behind a newer one must not publish over a
          # newer dashboard (one the tip changed since this commit).
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          # Only a tip strictly ahead of this commit, with the full file list (the API lists at most 300), and no change
          # to the dashboard or to the workflow that deploys it. Anything else leaves publishing to the newer run.
          elif changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$tip" --jq '
                 if .status == "ahead" and (.files | length) < 300
                 then [.files[].filename | select(startswith("dashboard/") or startswith("infra/") or startswith(".github/workflows/"))] | length
                 else -1 end') && [ "$changed" = 0 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "::notice::main has moved on, but its dashboard is this one; publishing."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "::notice::main has moved on with dashboard changes; the newer run publishes the dashboard."
          fi

      - uses: actions/download-artifact@v4
        if: steps.setup.outputs.ready == 'true' && steps.tip.outputs.publish == 'true'
        with:
          name: dashboard-bundle

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true' && steps.tip.outputs.publish == 'true'
        with:
          node-version: "22"

      - uses: azure/login@v2
        if: steps.setup.outputs.ready == 'true' && steps.tip.outputs.publish == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish the dashboard
        if: steps.setup.outputs.ready == 'true' && steps.tip.outputs.publish == 'true'
        env:
          EXPECTED_SHA256: ${{ needs.dashboard-bundle.outputs.sha256 }}
        run: |
          echo "$EXPECTED_SHA256  dashboard-bundle.tgz" | sha256sum -c --quiet -
          tar -xzf dashboard-bundle.tgz
          settings="infra/environments/${DASHBOARD_ENVIRONMENT}.json"
          group=$(jq -r .resourceGroup "$settings")
          app="stapp-$(jq -r .namePrefix "$settings")-$(jq -r .environmentName "$settings")"
          token=$(az staticwebapp secrets list --name "$app" --resource-group "$group" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          [ -n "$token" ] || { echo "::error::Couldn't read the deployment token of $app."; exit 1; }
          # Hygiene, not a boundary: code in this step could still reach the runner's secrets. The real limit is the
          # identity's role, which grants no more than the deployment token the CLI is given anyway (ADR-0010).
          az logout
          # The CLI downloads Azure's StaticSitesClient on each run; a failed download is retried, nothing else is.
          set -o pipefail # the deploy's status, not tee's
          for attempt in 1 2 3; do
            if SWA_CLI_DEPLOYMENT_TOKEN="$token" env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
                 .swa-cli/node_modules/.bin/swa deploy dashboard/app --api-location dashboard/api \
                 --api-language node --api-version 22 --env production 2>&1 | tee swa-deploy.log; then
              # The CLI exits 0 even when the upload itself fails: only its success line counts.
              grep -q "Project deployed to" swa-deploy.log && exit 0
              echo "::error::The SWA CLI exited without deploying the dashboard."; exit 1
            fi
            grep -Eq 'StaticSitesClient failed|Failed to download StaticSitesClient|Could not load StaticSitesClient metadata|Checksum mismatch for StaticSitesClient' \
              swa-deploy.log && [ "$attempt" -lt 3 ] || exit 1
            echo "::warning::Downloading StaticSitesClient failed (attempt $attempt); retrying."
            sleep $((attempt * 20))
          done

  agents-images:
    # Step 1 of deploying the paper engine and the agent jobs to Azure Container Apps (after a push to main that changes
    # them, or a manual run on main), once their deploy identity is set up: build both images here, in a job with no Azure
    # access, so nothing the build installs runs where credentials are in reach. Hands them to deploy-agents as an artifact.
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' && vars.AGENTS_AZURE_CLIENT_ID != ''
      && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.plan.outputs.images == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
      engine_sha256: ${{ steps.images.outputs.engine_sha256 }}
      trader_sha256: ${{ steps.images.outputs.trader_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Anything to deploy to, and still the tip of main?
        id: tip
        env:
          SETTINGS: infra/environments/${{ vars.AGENTS_ENVIRONMENT || 'dev' }}.json
          GH_TOKEN: ${{ github.token }} # this step only
        run: bash tools/ci/agents-tip.sh

      - name: Build the images
        id: images
        if: steps.tip.outputs.deploy == 'true'
        env:
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          docker build --file docker/engine.Dockerfile --tag cix-engine:ci .
          docker build --file docker/trader.Dockerfile --build-arg "CLAUDE_CODE_VERSION=$CLAUDE_CODE_VERSION" --tag cix-trader:ci .
          docker save cix-engine:ci | gzip > engine.tar.gz
          docker save cix-trader:ci | gzip > trader.tar.gz
          # The deploy job checks these hashes: a job output can't be changed by other jobs, an artifact could be replaced.
          echo "engine_sha256=$(sha256sum engine.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "trader_sha256=$(sha256sum trader.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.tip.outputs.deploy == 'true'
        with:
          name: agents-images
          path: |
            engine.tar.gz
            trader.tar.gz
          compression-level: 0 # already gzipped
          retention-days: 1

  deploy-agents:
    # Step 2: sign in to Azure as the agents' deploy identity, which trusts only workflows on main of this repository (an
    # OIDC federated credential, as for the dashboard: ADR-0010). It may push images to this environment's registry and
    # update the existing engine app and jobs. It can't create resources or role assignments, nor read Key Vault directly,
    # but an image it deploys runs with the apps' identities (docs/azure.md). An update could change more than the image
    # (Azure has no narrower right); tools/ci/deploy-agents.sh sends only the containers. It waits for the engine's new
    # revision to be healthy, then updates the jobs, and goes back to the previous images if anything fails.
    # Set up once with tools/azure/setup-ci-deploy.ps1 -For agents (docs/azure.md).
    needs: [build-test, containers, secret-scan, agents-images]
    # The checks may have been skipped (they passed on this exact content in the pull request); none may have failed,
    # and cancelling the run stops the deployment (the last step rolls back a half-done one).
    if: >-
      !cancelled() && needs.agents-images.outputs.deploy == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # for the Azure sign-in; only this job and deploy-dashboard have it
    concurrency:
      group: deploy-agents
      cancel-in-progress: false
    env:
      AGENTS_AZURE_CLIENT_ID: ${{ vars.AGENTS_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AGENTS_REGISTRY: ${{ vars.AGENTS_REGISTRY }}
      SETTINGS: infra/environments/${{ vars.AGENTS_ENVIRONMENT || 'dev' }}.json
    steps:
      - name: Is the deploy identity set up?
        run: |
          if [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ] || [ -z "$AGENTS_REGISTRY" ]; then
            echo "::error::Set the repository variables AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and AGENTS_REGISTRY too (tools/azure/setup-ci-deploy.ps1 -For agents)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Still the tip of main?
        id: tip
        env:
          GH_TOKEN: ${{ github.token }} # this step only; the deploy step below doesn't get it
        # Checked again inside the concurrency group: an older run waiting behind a newer one must not deploy over newer
        # images.
        run: bash tools/ci/agents-tip.sh

      - uses: actions/download-artifact@v4
        if: steps.tip.outputs.deploy == 'true'
        with:
          name: agents-images

      - uses: azure/login@v2
        if: steps.tip.outputs.deploy == 'true'
        with:
          client-id: ${{ vars.AGENTS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the engine and the agents
        if: steps.tip.outputs.deploy == 'true'
        env:
          ENGINE_SHA256: ${{ needs.agents-images.outputs.engine_sha256 }}
          TRADER_SHA256: ${{ needs.agents-images.outputs.trader_sha256 }}
        run: |
          for h in "$ENGINE_SHA256" "$TRADER_SHA256"; do
            [[ "$h" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::The images' hashes are missing."; exit 1; }
          done
          printf '%s  engine.tar.gz\n%s  trader.tar.gz\n' "$ENGINE_SHA256" "$TRADER_SHA256" | sha256sum -c --strict --quiet -
          SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID" REGISTRY="$AGENTS_REGISTRY" TAG="$GITHUB_SHA" \
            ENGINE_ARCHIVE=engine.tar.gz TRADER_ARCHIVE=trader.tar.gz ROLLBACK_FILE="$RUNNER_TEMP/agents-rollback.json" \
            bash tools/ci/deploy-agents.sh

      - name: Roll back an interrupted deployment
        # Only does something when the deploy step stopped halfway (cancelled, or timed out) and left the previous images
        # in the rollback file.
        if: (cancelled() || failure()) && steps.tip.outputs.deploy == 'true'
        run: |
          SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID" ROLLBACK_FILE="$RUNNER_TEMP/agents-rollback.json" \
            bash tools/ci/deploy-agents.sh --roll-back
